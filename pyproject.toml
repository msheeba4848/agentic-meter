[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentledger"
version = "0.3.0"
description = "FinOps for LLM agents: budgets, counterfactual costs, and waste tracking for OpenAI and Anthropic"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["llm", "openai", "anthropic", "cost", "budget", "finops", "agents", "tracking", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Core has zero runtime dependencies. SDKs are optional extras.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
langchain = ["langchain-core>=0.3.0"]
all = ["openai>=1.0.0", "anthropic>=0.20.0", "langchain-core>=0.3.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "langchain-core>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/agentledger"
Issues = "https://github.com/yourusername/agentledger/issues"
Source = "https://github.com/yourusername/agentledger"

[tool.hatch.build.targets.wheel]
packages = ["src/agentledger"]

[tool.hatch.build]
include = [
    "src/agentledger/**/*.py",
    "src/agentledger/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"