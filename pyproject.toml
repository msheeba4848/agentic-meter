[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenticmeter"
version = "0.4.1"
description = "FinOps for LLM agents: budgets, waste tracking, and caching analysis for OpenAI, Anthropic, and AWS Bedrock"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sheeba Moghal", email = "sm3924@georgetown.edu"}]
keywords = ["llm", "openai", "anthropic", "cost", "budget", "finops", "agents", "tracking", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Core has zero runtime dependencies. SDKs are optional extras.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
bedrock = ["boto3>=1.28.0"]
langchain = ["langchain-core>=0.3.0"]
all = ["openai>=1.0.0", "anthropic>=0.20.0", "boto3>=1.28.0", "langchain-core>=0.3.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "boto3>=1.28.0",
    "langchain-core>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/msheeba4848/agentic-meter"
Issues = "https://github.com/msheeba4848/agentic-meter/issues"
Source = "https://github.com/msheeba4848/agentic-meter"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmeter"]

[tool.hatch.build]
include = [
    "src/agenticmeter/**/*.py",
    "src/agenticmeter/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"